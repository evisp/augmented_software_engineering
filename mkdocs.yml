site_name: Augmented Software Engineering
site_description: >-
  A practical foundation for modern software engineering,
  development tools, and AI-augmented workflows.
site_url: https://evisp.github.io/augmented_software_engineering/
site_author: Evis Plaku

repo_url: https://github.com/evisp/augmented_software_engineering
repo_name: evisp/augmented_software_engineering
edit_uri: edit/main/docs/

copyright: >-
  &copy; 2026 Holberton School Albania

theme:
  name: material
  custom_dir: overrides
  language: en

  font:
    text: Host Grotesk
    code: JetBrains Mono

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

  icon:
    repo: fontawesome/brands/github
    edit: material/pencil

extra_css:
  - stylesheets/brand.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false
  tagline: Don't learn tech. Build it.
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/evisp
      name: GitHub

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables

  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3

  - pymdownx.arithmatex:
      generic: true

  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets

  # Mermaid diagrams: ```mermaid fences (Git branching, workflows)
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  # Windows / macOS / Linux tabs
  - pymdownx.tabbed:
      alternate_style: true

  # "Before you continue" checklists: - [ ] item
  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.tilde

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Roadmap: roadmap.md

  - Tools:
      - 01-tools/index.md
      - Getting Started:
          - Zero Day: 01-tools/zero-day.md
          - WSL: 01-tools/wsl-setup.md
          - VS Code: 01-tools/vscode-setup.md
          - AI Assistant: 01-tools/ai-assistant.md
      - Shell & Version Control:
          - Shell Basics: 01-tools/shell.md
          - Shell Permissions: 01-tools/shell-permissions.md
          - Git & GitHub: 01-tools/git-and-github.md
          - GitHub Flow: 01-tools/github-flow.md

  - Foundations:
      - 02-foundations/index.md
      - Python Fundamentals:
          - 02-foundations/python/index.md
          - Environment & First Programs: 02-foundations/python/environment.md
          - Hello, World: 02-foundations/python/hello-world.md
          - Control Flow: 02-foundations/python/control-flow.md
      - Object-Oriented Design: 02-foundations/oop/index.md

  - Software Development:
      - 03-software-development/index.md
      - Data & APIs: 03-software-development/data-and-apis/index.md
      - Web Front-end: 03-software-development/web-frontend/index.md
      - JavaScript & Node.js: 03-software-development/javascript-node/index.md

  - Portfolio:
      - 04-portfolio/index.md
      - AI-Augmented Builds: 04-portfolio/ai-builds/index.md
      - HBnB: 04-portfolio/hbnb/index.md
