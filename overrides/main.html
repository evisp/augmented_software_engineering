{% extends "base.html" %}

{#-
  Holberton tagline band, shown above Material's own footer on every page.
  The text comes from `extra.tagline` in mkdocs.yml.
-#}
{% block footer %}
  {% if config.extra.tagline %}
    <div class="h-tagline">
      <div class="md-grid h-tagline__inner">
        <hr class="h-tagline__rule">
        <p class="h-tagline__text">{{ config.extra.tagline }}</p>
      </div>
    </div>
  {% endif %}
  {{ super() }}
{% endblock %}
